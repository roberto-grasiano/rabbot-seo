name: release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds all 6 OS/arch binaries + checksums, generates an SBOM per archive,
# keyless-signs the artifacts with cosign (Sigstore), opens the Homebrew/Scoop PRs,
# and pushes multi-arch Docker images to ghcr.io. The GitHub Release is created
# as a DRAFT (see .goreleaser.yaml `release.draft`) — review and publish it.
#
# One-time setup (see docs/RELEASING.md):
#   - create repos roberto-grasiano/homebrew-rabbot-seo and roberto-grasiano/scoop-rabbot-seo
#   - add a PAT (repo scope on those two repos) as the secret TAP_GITHUB_TOKEN
#   - GHCR push uses the built-in GITHUB_TOKEN (packages: write below)

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # Least-privilege: scope the elevated tokens to the one job that needs them so a
    # job added to this workflow later can't inherit id-token (the keyless-signing identity).
    permissions:
      contents: write # create the GitHub Release + upload archives/checksums
      packages: write # push Docker images to ghcr.io
      id-token: write # mint the OIDC token cosign uses for keyless Fulcio/Rekor signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the changelog/previous-tag works

      - uses: actions/setup-go@v6
        with:
          # Release binaries MUST be built on Go >= 1.26.4 to clear the reachable
          # stdlib CVEs GO-2026-5039 (net/textproto) and GO-2026-5037
          # (crypto/x509), both reached via the control server's
          # http.Server.Serve. Pinned explicitly rather than via go-version-file
          # so go.mod's `go 1.26` minor directive can't resolve to an older patch.
          go-version: "1.26.4"
          check-latest: true
          cache: true

      # Multi-arch Docker (linux/arm64 on an amd64 runner) needs QEMU + buildx.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless signing + SBOMs: GoReleaser shells out to cosign and syft, which
      # are not preinstalled on the runner. Pinned by major version (repo house
      # style). cosign uses the job's OIDC token (id-token: write) — no key material.
      - uses: sigstore/cosign-installer@v4
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with repo scope on the tap + bucket repos. If unset, the
          # Homebrew/Scoop steps fail but the binaries/Docker still publish.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
