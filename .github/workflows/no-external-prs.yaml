name: no external PRs

# This project accepts ISSUES, not pull requests (single-author, to keep copyright in one
# place — see CONTRIBUTING.md). Politely close PRs from anyone who isn't the owner or a
# collaborator, pointing them at issues. The maintainer's own PRs (author_association
# OWNER/MEMBER/COLLABORATOR) are left untouched, so the normal workflow is unaffected.
#
# Uses pull_request_target so the token can comment on + close PRs from forks. It does NOT
# check out or run any PR code — it only calls the issues/pulls REST API — which is the safe
# way to use pull_request_target (no untrusted code ever executes).

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    # Skip the maintainer's own PRs; only act on outside contributors.
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "Thanks for your interest in Rabbot-SEO! 🐰",
                "",
                "This project takes **issues, not pull requests** — it's maintained by a single",
                "author to keep the codebase coherent. I'm closing this PR, but please don't read",
                "it as a rejection of the idea.",
                "",
                "If you hit a bug or want a change, please [open an issue](../../issues/new/choose)",
                "describing it — well-scoped bug reports and feature requests are genuinely welcome",
                "and are the way changes get in. See [CONTRIBUTING.md](../blob/HEAD/CONTRIBUTING.md).",
              ].join("\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
