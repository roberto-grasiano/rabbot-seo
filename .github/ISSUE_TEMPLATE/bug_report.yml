name: Bug report
description: Something in Rabbot-SEO misbehaves
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Rabbot version
      description: Paste the output of `rabbot version`.
      placeholder: rabbot v0.1.0 (commit abc1234, built 2026-06-12)
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: OS / architecture
      placeholder: e.g. Ubuntu 24.04 amd64, macOS 15 arm64, Windows 11 amd64
    validations:
      required: true
  - type: dropdown
    id: install-channel
    attributes:
      label: Install channel
      options:
        - Homebrew
        - Scoop
        - Docker
        - install.sh
        - Built from source
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include exact error output where possible.
    validations:
      required: true
  - type: textarea
    id: config-logs
    attributes:
      label: Config and logs
      description: >-
        Relevant parts of your config file and log output.
        **Redact Slack webhook URLs and tokens** (and any SMTP or webhook
        credentials) before posting — they are secrets.
      render: text
    validations:
      required: false
