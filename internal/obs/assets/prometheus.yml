# prometheus.yml — scrape config for Rabbot-SEO self-observability
#
# Scrapes the daemon's read-only /metrics endpoint. The default target is the
# loopback bind `127.0.0.1:9464` (the address `rabbot observability init` sets
# for metrics.addr); with `network_mode: host` Prometheus shares the host's
# loopback, so this reaches the daemon directly.
#
# rabbot-in-Docker variant: scrape `rabbot:9464` (the daemon's compose service
# name) instead — see the commented block in docker-compose.observability.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rabbot
    static_configs:
      - targets: ["127.0.0.1:9464"]
